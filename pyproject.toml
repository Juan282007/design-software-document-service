[project]
name = "document-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "pydantic>=2.9", "httpx>=0.27", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "PyJWT[crypto]>=2.10", "pybars3>=0.9.7", "pika>=1.3", "boto3>=1.35", "xhtml2pdf>=0.2.23", "prometheus-client>=0.20"]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires a real external dependency"]
